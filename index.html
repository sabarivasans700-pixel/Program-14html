<!DOCTYPE html>
<html>
<head>
    <title>Absolute Positioning</title>
    <style>
        .box {
            position: absolute;
            top: 100px;
            left: 200px;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h2>Absolute Positioning Example</h2>

    <div class="box">
        This box uses absolute positioning.
    </div>

</body>
</html>
